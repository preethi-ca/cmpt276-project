<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title th:text="${salon.name} + ' | BookEasy'">BookEasy Salon</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <nav class="navbar bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">BookEasy</a>

        <div>
          <a
            class="btn btn-outline-secondary me-2"
            th:href="@{/customer/appointments}"
          >
            My Appointments
          </a>

          <a class="btn btn-outline-secondary" th:href="@{/login}"> Sign In </a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="card mb-4">
        <div class="card-body">
          <div class="row">
            <div class="col-md-8">
              <p class="text-success fw-semibold">BOOK AN APPOINTMENT</p>

              <h1 th:text="${salon.name}">Magiccuts Salon</h1>

              <p th:text="${salon.address}">123 Main Street</p>
            </div>

            <div class="col-md-4">
              <h5>Opening Hours</h5>

              <div th:each="day : ${salon.openingHours}">
                <div class="d-flex justify-content-between">
                  <span th:text="${days[day.dayOfWeek - 1]}"></span>

                  <span
                    th:text="${day.open
                                ? day.startTime + ' - ' + day.endTime
                                : 'Closed'}"
                  >
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h2 class="h4 mb-3">Choose a Service</h2>

          <p class="text-muted">
            All appointments are one hour. Prices shown in CAD.
          </p>

          <div class="row g-3">
            <div class="col-md-4" th:each="item : ${salon.services}">
              <div class="card h-100">
                <div class="card-body">
                  <h3 class="h5" th:text="${item.name}">Haircut</h3>

                  <p class="fw-bold" th:text="'$' + ${item.price}">$30</p>

                  <p class="text-muted">One-hour appointment</p>

                  <a
                    class="btn btn-success"
                    th:href="@{/customer/booking(
                                    service=${item.id},
                                    salon=${salon.slug}
                               )}"
                  >
                    Book Service
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
