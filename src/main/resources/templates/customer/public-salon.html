
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${salon.name} + ' | BookEasy'">BookEasy Salon</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main class="preview">
    <div class="preview-header">
        <h1 th:text="${salon.name}"></h1>
        <p class="lead" th:text="${salon.description}"></p>
        <p class="muted" th:text="${salon.address}"></p>
    </div>

    <div class="two-column">
        <section class="panel">
            <h2>Our services</h2>
            <p class="muted">One-hour appointments. Prices in CAD</p>
            <p th:if="${salon.services.isEmpty()}">No services are available yet.</p>

            <div class="saved-day" th:each="item : ${salon.services}">
                <div>
                    <strong th:text="${item.name}"></strong>
                    <span th:text="'$' + ${item.price}"></span>
                </div>

                <!-- Customer can select a service to book. -->
                <a th:href="@{/customer/booking(service=${item.id}, salon=${salon.slug})}"><button type="button">Book this service</button></a>
            </div>
        </section>

        <section class="panel">
            <h2>Opening hours</h2>
            <p class="muted">Opening hours are in Vancouver time (PDT)</p>
            <p th:unless="${salon.hoursConfigured}">Opening hours have not been set yet</p>

            <div class="saved-day" th:each="day : ${salon.openingHours}">
                <strong th:text="${days[day.dayOfWeek - 1]}"></strong>
                <span th:text="${day.open ? day.startTime + ' – ' + day.endTime : 'Closed'}"></span>
            </div>
        </section>
    </div>
</main>

</body>
</html>
