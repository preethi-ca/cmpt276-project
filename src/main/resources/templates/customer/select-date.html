<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BookEasy - Select Date</title>

        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>

    <body>
        <main class="container py-5">
        <!--Booking progress bar-->
        <div th:replace="~{customer/fragments/booking-progress :: bookingProgress(2)}"></div>
        
        <div class="mb-4">
            <h1>Book Your Appointment</h1>
            <p class="text-muted mb-0">Selected Service:<strong th:text="${serviceName}"></strong></p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row g-4">
            <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                <h2 class="h5 mb-3">Select a Date</h2>

                <form th:action="@{/customer/booking/time}" method="get">
                    <input type="hidden" name="service" th:value="${service}"/>
                    <input type="hidden" name="salon" th:value="${salon}"/>

                    <div class="mb-3">
                    <label for="appointmentDate" class="form-label">Appointment Date</label>

                    <input
                        type="date"
                        id="appointmentDate"
                        name="appointmentDate"
                        class="form-control"
                        th:attr="min=${minDate}" 
                        required/>
                    </div>

                    <button type="submit" class="btn btn-success">Continue</button>
                </form>
                </div>
            </div>
            </div>

            <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">

                <!-- Display the salon's opening hours-->
                <h2 class="h5 mb-3">Salon Opening Hours</h2>
                <div th:each="day : ${openingHours}" class="d-flex justify-content-between border-bottom py-2">
                    <strong th:text="${days[day.dayOfWeek - 1]}"></strong>
                    <span th:if="${day.open}" th:text="${day.startTime + ' - ' + day.endTime}"></span>
                    <span th:unless="${day.open}" class="text-muted"> Closed </span>
                </div>
                </div>
            </div>
            </div>
        </div>

        <!--navigation buttons-->
        <div class="mt-4">
            <a th:if="${salon != null}" th:href="@{/salons/{slug}(slug=${salon})}" class="btn btn-outline-secondary">
                Back to Services
            </a>
        </div>

        </main>
    </body>
</html>
