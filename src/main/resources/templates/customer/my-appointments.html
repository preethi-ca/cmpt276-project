<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Appointments</title>

        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
        <link rel="stylesheet" th:href="@{/css/style.css}" />

        <script th:src="@{/js/cancel-confirmation.js}" defer></script>
    </head>

    <body>
        <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>My Appointments</h1>

            <a th:href="@{/customer/dashboard}" class="btn btn-outline-secondary">
                Back to Home
            </a>
        </div>

        <div th:if="${#lists.isEmpty(appointments)}" class="alert alert-secondary">
            You currently have no appointments.
        </div>

        <!--appointment overview card-->
        <div th:each="appointment : ${appointments}" class="card shadow-sm mb-4">
            <div class="card-body">
            <p class="card-title h4 mb-2 fw-bold text-decoration-underline" 
                th:text="${salonNames[appointment.id]}">
            </p>

            <p class="mb-2">
                <strong>Service:</strong>
                <span th:text="${appointment.serviceName}"></span>
            </p>

            <p class="mb-2">
                <strong>Date:</strong>
                <span th:text="${appointment.appointmentDate}"></span>
            </p>

            <p class="mb-3">
                <strong>Time:</strong>
                <span th:text="${appointment.appointmentTime}"></span>
            </p>

            <!--navigation buttons-->
            <div class="d-flex gap-2">
                <a th:href="@{/customer/appointments/details(id=${appointment.id})}" class="btn btn-success">
                    View Details
                </a>

                <form th:action="@{/customer/appointments/cancel}"
                    method="post">

                    <input type="hidden" name="id" th:value="${appointment.id}" />

                    <button type="submit" class="btn btn-outline-danger">
                        Cancel Appointment
                    </button>
                </form>
            </div>
            </div>
        </div>
        </main>
    </body>
</html>
