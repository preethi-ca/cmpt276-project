
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Booking Successful</title>
</head>
<body>
    <h1>Booking Confirmed!</h1>
    <p>Your appointment has been successfully booked</p>

    <h3>Appointment Details:</h3>
    <p>Salon: <span th:text="${salonName}"></span></p>
    <p>Service: <span th:text="${serviceName}"></span></p>
    <p>Date: <span th:text="${appointmentDate}"></span></p>
    <p>Time: <span th:text="${appointmentTime}"></span></p>
    <p>Price: $<span th:text="${bookedService.price}"></span></p>
    
    <a th:href="@{/salons/{slug}(slug=${salon})}"><button type="button">Book Another Appointment</button></a>
    <a th:href="@{/customer/dashboard}"><button type="button">Back to Home</button></a>
</body>
</html>
