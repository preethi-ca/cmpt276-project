<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard</title>
</head>


<body>
    <h1>Welcome to BookEasy!</h1>
    <h2>Customer Dashboard</h2>

    <!-- link to customer's appointments -->
    <a th:href="@{/customer/appointments}"><button type="button">View My Appointments</button></a>

    <h4>Please go to: http://localhost:8080/salons/salon-name</h4>
    <p>Example: Salon name = Sally Salon</p>
    <p>Go to: http://localhost:8080/salons/sally-salon</p>

    <p>Example: Salon name = BestNails</p>
    <p>Go to: http://localhost:8080/salons/bestnails</p>

    <form th:action="@{/logout}" method="post" novalidate>
        <button type="submit">Log Out</button>
    </form>
</body>

</html>
