<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script th:src="@{/owner-assets/forms.js}" defer></script>
  </head>

  <body>
    <main class="container py-5">
      <div class="text-center mb-4">
        <h1>Welcome to BookEasy!</h1>
        <h2 class="h4 text-muted">Customer Dashboard</h2>
      </div>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h3 class="card-title h5">Your Appointments</h3>

          <a th:href="@{/customer/appointments}" class="btn btn-success">
            View My Appointments
          </a>
        </div>
      </section>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h3 class="card-title h5 mb-3">Visit a Salon</h3>

          <!-- Use the platform's native selector and the existing server-rendered navigation flow. -->
          <form th:action="@{/customer/salons/visit}" method="get" novalidate data-submit-guard>
            <div class="mb-3">
              <select id="salon" name="slug" class="form-select" aria-label="Choose a salon" required
                      th:disabled="${#lists.isEmpty(salons)}"
                      th:attr="aria-invalid=${salonError != null} ? 'true' : null,
                               aria-describedby=${salonError != null} ? 'salon-error' : (${#lists.isEmpty(salons)} ? 'salon-empty' : null)">
                <option value="" selected>Select a salon</option>
                <option th:each="salon : ${salons}" th:value="${salon.slug}"
                        th:text="${salon.name + (#strings.isEmpty(salon.address) ? '' : ' — ' + salon.address) + (#strings.isEmpty(salon.city) ? '' : ' (' + salon.city + ')')}"></option>
              </select>
              <p th:if="${salonError != null}" id="salon-error" class="text-danger mt-2 mb-0"
                 role="alert" th:text="${salonError}"></p>
              <p th:if="${#lists.isEmpty(salons)}" id="salon-empty" class="text-muted mt-2 mb-0">
                No salons are available yet.
              </p>
            </div>
            <button type="submit" class="btn btn-success" th:disabled="${#lists.isEmpty(salons)}">
              Visit Salon
            </button>
          </form>
        </div>
      </section>

      <form th:action="@{/logout}" method="post" novalidate>
        <button type="submit" class="btn btn-outline-danger">Log Out</button>
      </form>
    </main>
  </body>
</html>
