<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <main class="customer-dashboard">
      <h1>Welcome to BookEasy!</h1>
      <h2>Customer Dashboard</h2>

      <section class="dashboard-card">
        <h3>Your Appointments</h3>

        <a th:href="@{/customer/appointments}" class="dashboard-button">
          View My Appointments
        </a>
      </section>

      <section class="dashboard-card">
        <h3>Visit a Salon</h3>

        <p>
          To visit a salon page, use:
          <strong>/salons/salon-name</strong>
        </p>

        <p>Example: Sally Salon</p>
        <p>/salons/sally-salon</p>

        <p>Example: BestNails</p>
        <p>/salons/best-nails</p>
      </section>

      <form th:action="@{/logout}" method="post" novalidate>
        <button type="submit" class="logout-button">Log Out</button>
      </form>
    </main>
  </body>
</html>
