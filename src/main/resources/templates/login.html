<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookEasy</title>
</head>

<body>
    <h1>Welcome Back to BookEasy!</h1>
    <p>Log in to manage your appointments or salon.</p>

    <p th:if="${param.registered}" style="color: green;">Account created successfully! Please log in.</p>

    <p th:if="${param.error}" style="color: red;">Invalid email or password. Please try again.</p>

    <p th:if="${param.logout}" style="color: green;">You have successfully logged out.</p>

    <form th:action="@{/login}" method="post">
        <label for="username">Email:</label>
        <input type="email" id="username" name="username" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <button type="submit">Log In</button>
    </form>

    <p>
        Don't have an account?
        <a th:href="@{/register}">Sign up</a>
    </p>

</body>
</html>
