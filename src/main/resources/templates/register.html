<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BookEasy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/owner-assets/forms.js}" defer></script>
</head>

<body>

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-left">
            <div class="brand">
                <h1>BookEasy</h1>
                <p>Your next salon visit, simply booked.</p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="auth-right">

            <div class="auth-form">

                <a th:href="@{/}" class="back-link">← Back to Salon</a>

                <h2>Create Account</h2>
                <p class="subtitle">
                    Register as a customer or salon owner.
                </p>

                <!-- Registration Form -->
                <form th:action="@{/register}" th:object="${registrationForm}" method="post" novalidate data-submit-guard>

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name" th:attr="aria-invalid=${#fields.hasErrors('name')} ? 'true' : null, aria-describedby=${#fields.hasErrors('name')} ? 'name-error' : null" th:field="*{name}"
                            placeholder="Enter your full name"
                            maxlength="100"
                            autocomplete="name"
                            required>
                        <p class="field-error" id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email" th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true' : null, aria-describedby=${#fields.hasErrors('email')} ? 'email-error' : null" th:field="*{email}"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>
                        <p class="field-error" id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password" th:attr="aria-invalid=${#fields.hasErrors('password')} ? 'true' : null, aria-describedby=${#fields.hasErrors('password')} ? 'password-error' : null"
                            placeholder="Create a password (min. 8 characters)"
                            minlength="8"
                            autocomplete="new-password"
                            required>
                        <p class="field-error" id="password-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                        <button type="button" class="password-toggle" data-password-toggle="password" aria-controls="password" aria-pressed="false">Show password</button>
                    </div>

                    <!-- Account Type -->
                    <div class="form-group">
                        <label for="roleType">Account Type</label>
                        <select
                            id="roleType"
                            name="roleType" th:attr="aria-invalid=${#fields.hasErrors('roleType')} ? 'true' : null, aria-describedby=${#fields.hasErrors('roleType')} ? 'roleType-error' : null" th:field="*{roleType}"
                            required>

                            <option value="">Select account type</option>
                            <option value="CUSTOMER">Customer</option>
                            <option value="SALONOWNER">Salon Owner</option>

                        </select>
                        <p class="field-error" id="roleType-error" th:if="${#fields.hasErrors('roleType')}" th:errors="*{roleType}"></p>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="primary-button">
                        Create Account
                    </button>

                </form>

                <!-- Login Link -->
                <div class="auth-divider">
                    <span>Already have an account?</span>
                </div>

                <a th:href="@{/login}" class="secondary-button">
                    Sign In
                </a>

            </div>

        </div>

    </div>

</body>
</html>
