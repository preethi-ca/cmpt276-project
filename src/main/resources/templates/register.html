<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BookEasy</title>
</head>
<body>
    <h1>Create a BookEasy Account</h1>
    <p>Register as a customer or salon owner.</p>
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <form th:action="@{/register}" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" maxlength="100" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <br><br>

        <label for="roleType">Account Type:</label>
        <select id="roleType" name="roleType" required>
            <option value="">Select account type</option>
            <option value="CUSTOMER">Customer</option>
            <option value="SALONOWNER">Salon Owner</option>
        </select>
        <br><br>

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a th:href="@{/login}">Log in</a>
    </p>

</body>
</html>
