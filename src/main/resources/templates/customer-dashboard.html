<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Easy - Customer Homepage</title>
</head>


<body>
    <h1>Welcome to BookEasy!</h1>
    <h2>Customer Dashboard</h2>

    <!-- link to customer's appointments -->
    <p><a th:href="@{/customer/appointments}">View My Appointments</a></p>
  
    <h2>Available Salon Services</h2>


<!--note the following are temorarly hard coded because I don't have Edwin's part yet-->
<!-- ***First sample service -->
    <div>
        <h3>Haircut</h3>
        <p>Price: $35.00</p>
        <p>Duration: 60 minutes</p>

        <!-- Service selection button-->
        <a th:href="@{/customer/booking(service='Haircut')}">
        <button type="button">Select Service</button>
        </a>
    </div>

<!-- ***Second sample service -->
    <div>
        <h3>Hair Colouring</h3>
        <p>Price: $80.00</p>
        <p>Duration: 60 minutes</p>

        <!-- Service selection button-->
        <a th:href="@{/customer/booking(service='Hair Colouring')}">
        <button type="button">Select Service</button>
        </a>
    </div>

<!-- ***Third sample service -->
    <div>
        <h3>Manicure</h3>
        <p>Price: $30.00</p>
        <p>Duration: 60 minutes</p>

        <!-- Service selection button-->
        <a th:href="@{/customer/booking(service='Manicure')}">
        <button type="button">Select Service</button>
        </a>
    </div>


    <form th:action="@{/logout}" method="post">
        <button type="submit">Log Out</button>
    </form>
</body>

</html>
