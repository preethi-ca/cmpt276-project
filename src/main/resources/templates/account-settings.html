<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - BookEasy</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/account-settings.css}">
</head>

<body>
    <main class="container py-5" style="max-width: 800px;">

    <div class="mb-4">
        <h1>Account Settings</h1>
        <p class="text-muted">
            Manage your personal information and account security.
        </p>
    </div>

    <div th:if="${message}"
         class="alert alert-success"
         role="status"
         th:text="${message}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         role="alert"
         th:text="${error}">
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h2 class="h5 mb-4">Personal Information</h2>

            <!-- ACCOUNT DETAILS FORM -->
            <form id="accountSettingsForm"
                  th:action="@{/account-settings}"
                  method="post">

                <div class="mb-3">
                    <label for="name" class="form-label">
                        Full Name
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        th:value="${account.name}"
                        maxlength="100"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email Address
                    </label>
                    <div class="form-control bg-light"
                         th:text="${account.email}">
                    </div>
                    <div class="form-text">
                        Email changes are not available yet.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="phoneNumber" class="form-label">
                        Phone Number
                    </label>
                    <input
                        type="tel"
                        class="form-control"
                        id="phoneNumber"
                        name="phoneNumber"
                        th:value="${account.phoneNumber}"
                        placeholder="604-555-1234">
                </div>

                <div class="mb-3">
                    <label for="notificationPreference"
                           class="form-label">
                        Notification Preference
                    </label>

                    <select
                        class="form-select"
                        id="notificationPreference"
                        name="notificationPreference">

                        <option value="EMAIL"
                            th:selected="${account.notificationPreference != null and account.notificationPreference.name() == 'EMAIL'}">
                            Email
                        </option>

                        <option value="SMS"
                            th:selected="${account.notificationPreference != null and account.notificationPreference.name() == 'SMS'}">
                            SMS
                        </option>

                        <option value="BOTH"
                            th:selected="${account.notificationPreference != null and account.notificationPreference.name() == 'BOTH'}">
                            Email and SMS
                        </option>
                    </select>

                    <div class="form-text">
                        SMS notifications require a phone number.
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        Account Type
                    </label>
                    <div class="form-control bg-light"
                         th:text="${account.roleType}">
                    </div>
                </div>

            </form>

            <hr class="my-4">

            <h2 class="h5 mb-3">Account Security</h2>

            <!-- PASSWORD ROW -->
            <div class="d-flex justify-content-between
                        align-items-center flex-wrap gap-3
                        border rounded p-3">

                <span class="password-dots">••••••••</span>

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="togglePassword"
                    aria-expanded="false"
                    aria-controls="passwordFields">
                    Change Password
                </button>
            </div>

            <!-- EXPANDABLE PASSWORD FORM -->
            <div id="passwordFields"
                 class="password-fields mt-3"
                 hidden>

                <form th:action="@{/change-password}"
                      method="post">

                    <div class="mb-3">
                        <label for="currentPassword"
                               class="form-label">
                            Current Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="currentPassword"
                            name="currentPassword"
                            autocomplete="current-password"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="newPassword"
                               class="form-label">
                            New Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="newPassword"
                            name="newPassword"
                            minlength="8"
                            maxlength="64"
                            autocomplete="new-password"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword"
                               class="form-label">
                            Confirm New Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirmPassword"
                            autocomplete="new-password"
                            required>
                    </div>

                    <button type="submit" class="btn btn-outline-success w-100">
                        Update Password
                    </button>
                </form>
            </div>

            <!-- SAVE ACCOUNT DETAILS -->
            <button
                type="submit"
                form="accountSettingsForm"
                class="btn btn-success w-100 mt-4">
                Save Changes
            </button>

        </div>
    </div>

    <a th:href="@{/dashboard}"
       class="btn btn-outline-secondary mt-4">
        ← Back to Dashboard
    </a>

</main>

<script th:src="@{/js/account-settings.js}" defer></script>
</body>
</html>
