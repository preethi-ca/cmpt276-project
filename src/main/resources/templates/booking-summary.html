<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookEasy - Booking Summary</title>
</head>

<body>
    <h1>Review Your Booking</h1>
    <p>Please check your appointment details are correct before continuing</p>

    <!-- show the booking information summary-->
    <h3>Service: <span th:text="${service}"></span></h3>
    <h3>Appointment Date: <span th:text="${appointmentDate}"></span></h3>
    <h3>Appointment Time: <span th:text="${appointmentTime}"></span></h3>
    
    <!-- Form that sends the booking details to the controller -->
    <form th:action="@{/customer/booking/confirm}" method="post">
        <input type="hidden" name="service" th:value="${service}">
        <input type="hidden" name="appointmentDate" th:value="${appointmentDate}">
        <input type="hidden" name="appointmentTime" th:value="${appointmentTime}">

        <button type="submit">Confirm Booking</button>
    </form>

    <a th:href="@{/customer/dashboard}">Back to Home</a>
</body>
</html>
