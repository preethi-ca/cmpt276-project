spring.application.name=cmpt276-project

spring.datasource.url=jdbc:h2:mem:bookeasy
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
# Temporary shared demo: H2 accounts and in-memory salons reset on restart.
# A persistent deployment must supply a SalonStore and persistent account database together.
spring.profiles.default=demo
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
